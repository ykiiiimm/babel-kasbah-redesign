<div id="onboardingOverlay" class="ob" role="dialog" aria-modal="true" aria-label="Sélection de langue / Language selection">

  <!-- Left Media Stage: Lab Photo & High-Tech Atmosphere -->
  <div class="ob-media-stage" aria-hidden="true">
    <img src="assets/on boarding.png" alt="Laboratoire BAB EL KASBAH" class="ob-photo-img" />
    <div class="ob-media-scrim"></div>
    <div class="ob-media-radial"></div>

    <!-- Verified Clinical Status Badge on Photo -->
    <div class="ob-media-badge">
      <span class="ob-badge-pulse"></span>
      <div class="ob-badge-content">
        <span class="ob-badge-title" id="obBadgeTitle">Biologie Médicale de Précision</span>
        <span class="ob-badge-sub" id="obBadgeSub">Plateau Technique Moderne · Taroudant</span>
      </div>
    </div>
  </div>

  <!-- Right Content Stage: Solid Crisp White Panel with Integrated Fluid Wave Divider -->
  <div class="ob-content-stage">

    <!-- Desktop Vertical Wave Divider (attached along edge of panel) -->
    <svg class="ob-wave-divider ob-wave-desktop" viewBox="0 0 90 1000" preserveAspectRatio="none" aria-hidden="true">
      <!-- Soft ambient wave layer for depth -->
      <path class="ob-wave-accent" d="M90,0 C65,180 25,320 58,480 C90,640 35,820 65,940 L90,1000 Z" fill="rgba(16, 38, 165, 0.05)" />
      <!-- Main solid white wave connecting seamlessly with panel -->
      <path class="ob-wave-main" d="M90,0 C50,150 15,300 45,460 C75,620 20,800 50,920 L90,1000 Z" fill="#ffffff" />
    </svg>

    <!-- Mobile Horizontal Wave Divider (attached above panel on mobile) -->
    <svg class="ob-wave-divider ob-wave-mobile" viewBox="0 0 1000 70" preserveAspectRatio="none" aria-hidden="true">
      <path class="ob-wave-accent" d="M0,70 L0,32 C200,6 380,55 580,22 C780,-8 900,38 1000,18 L1000,70 Z" fill="rgba(16, 38, 165, 0.05)" />
      <path class="ob-wave-main" d="M0,70 L0,45 C180,18 360,50 560,20 C760,-10 900,32 1000,28 L1000,70 Z" fill="#ffffff" />
    </svg>

    <!-- Inner Content Container -->
    <div class="ob-panel-card">

      <!-- Lab Branding & Doctor Signature -->
      <div class="ob-brand-block">
        <img src="assets/logo.png" alt="Laboratoire BAB EL KASBAH" class="ob-logo" />
        <div class="ob-brand-details">
          <span class="ob-brand-name">BAB EL KASBAH</span>
          <span class="ob-brand-doc">Dr. CHELLAOUI Said · Taroudant</span>
        </div>
      </div>

      <!-- Section Title & Subtitle -->
      <div class="ob-headings">
        <span class="ob-kicker" id="obKicker">BIENVENUE · MARHABAN · WELCOME</span>
        <h1 class="ob-title" id="obChoose">Choisissez votre langue</h1>
        <p class="ob-subtitle" id="obSubtitle">Portail officiel de biologie médicale et analyses cliniques</p>
      </div>

      <!-- 3 Interactive Language Cards -->
      <div class="ob-langs" id="langList" role="radiogroup" aria-label="Choix de la langue">

        <!-- FR Button -->
        <button class="ob-lang-btn is-selected" data-lang="fr" role="radio" aria-checked="true" type="button" style="--i:0;">
          <span class="ob-lang-badge">FR</span>
          <div class="ob-lang-text">
            <span class="ob-lang-native">Français</span>
            <span class="ob-lang-sub" id="obDescFr">Site en français</span>
          </div>
          <div class="ob-lang-radio" aria-hidden="true">
            <svg class="ob-check-icon" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path class="ob-check-mark" d="M4.8 8.2L6.9 10.3L11.3 5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </button>

        <!-- AR Button -->
        <button class="ob-lang-btn" data-lang="ar" role="radio" aria-checked="false" type="button" style="--i:1;">
          <span class="ob-lang-badge">AR</span>
          <div class="ob-lang-text">
            <span class="ob-lang-native">العربية</span>
            <span class="ob-lang-sub" id="obDescAr">الموقع باللغة العربية</span>
          </div>
          <div class="ob-lang-radio" aria-hidden="true">
            <svg class="ob-check-icon" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path class="ob-check-mark" d="M4.8 8.2L6.9 10.3L11.3 5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </button>

        <!-- EN Button -->
        <button class="ob-lang-btn" data-lang="en" role="radio" aria-checked="false" type="button" style="--i:2;">
          <span class="ob-lang-badge">EN</span>
          <div class="ob-lang-text">
            <span class="ob-lang-native">English</span>
            <span class="ob-lang-sub" id="obDescEn">Website in English</span>
          </div>
          <div class="ob-lang-radio" aria-hidden="true">
            <svg class="ob-check-icon" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path class="ob-check-mark" d="M4.8 8.2L6.9 10.3L11.3 5.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </button>

      </div>

      <!-- Primary Call to Action -->
      <button class="ob-cta" id="obContinue" type="button">
        <span class="ob-cta-label" id="obContinueText">Accéder au site</span>
        <span class="ob-cta-arrow" data-dir-arrow aria-hidden="true">→</span>
      </button>

      <!-- Trust Tagline & Shield -->
      <div class="ob-footer-note">
        <svg class="ob-shield-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 2L3 5.5V9.8C3 14.1 6 18.1 10 19C14 18.1 17 14.1 17 9.8V5.5L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M7 10L9 12L13 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="obTagline">Laboratoire de Biologie Médicale · Taroudant</span>
      </div>

    </div>
  </div>

</div>
