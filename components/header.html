<header class="site-header" id="top">
  <a class="brand" href="#top" aria-label="Laboratoire Babel Kasbah">
    <img src="assets/logo.png" alt="Laboratoire Babel Kasbah" />
  </a>
  <nav class="nav" id="mainNav" aria-label="Navigation principale">
    <a href="#top" data-i18n="nav.home">Accueil</a>
    <a href="#expertise" data-i18n="nav.expertise">Expertise</a>
    <a href="#analyses" data-i18n="nav.analyses">Analyses</a>
    <a href="#equipe" data-i18n="nav.team">Équipe</a>
    <a href="#results" data-i18n="nav.results">Résultats</a>
    <a href="#voices" data-i18n="nav.reviews">Avis</a>
    <a href="#faq" data-i18n="nav.faq">FAQ</a>
    <a href="#contact" data-i18n="nav.contact">Contact</a>
    <a href="#localisation" data-i18n="nav.map">Plan d'accès</a>

    <!-- Mobile drawer language switcher -->
    <div class="mobile-lang-drawer" role="group" aria-label="Langue">
      <button class="mls-btn is-active" data-ls="fr">Français</button>
      <button class="mls-btn" data-ls="ar">العربية</button>
      <button class="mls-btn" data-ls="en">English</button>
    </div>
  </nav>
  <div class="header-actions">
    <!-- Compact Language Switcher Pill -->
    <div class="lang-switcher" role="group" aria-label="Changer de langue">
      <button class="ls-btn is-active" data-ls="fr" aria-pressed="true">FR</button>
      <span class="ls-divider" aria-hidden="true">|</span>
      <button class="ls-btn" data-ls="ar" aria-pressed="false">AR</button>
      <span class="ls-divider" aria-hidden="true">|</span>
      <button class="ls-btn" data-ls="en" aria-pressed="false">EN</button>
    </div>

    <button class="learn-more" id="headerCta" aria-label="Prendre rendez-vous" data-i18n-aria="header.ctaAria">
      <span class="circle" aria-hidden="true">
        <span class="icon arrow"></span>
      </span>
      <span class="button-text" data-i18n="header.cta">Prendre rendez-vous</span>
    </button>
  </div>
  <button class="menu-toggle" aria-label="Ouvrir le menu" data-i18n-aria="header.openMenu"><span></span><span></span></button>
</header>
